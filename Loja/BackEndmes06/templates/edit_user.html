{% extends "base.html" %}

{% block title %}Editar Usuário{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-12 col-md-10 col-lg-7">

        <div class="nexus-card p-4 p-md-5">

            <!-- Cabeçalho -->
            <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                <div class="brand-icon-box" style="width: 48px; height: 48px; font-size: 1.4rem;">
                    <i class="bi bi-pencil-square"></i>
                </div>
                <div>
                    <h1 class="h4 fw-bold text-dark mb-1">Editar Dados do Usuário</h1>
                    <p class="text-muted small mb-0">Atualize suas informações cadastrais na plataforma.</p>
                </div>
            </div>

            <!-- Formulário -->
            <form action="{{ url_for('user.editar_usuario', user_id=usuario.id) }}" method="POST">

                <div class="mb-3">
                    <label for="name" class="nexus-label">
                        <i class="bi bi-person text-primary"></i> Nome Completo / Usuário <span class="text-danger">*</span>
                    </label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-person"></i>
                        <input type="text"
                               class="form-control nexus-input w-100"
                               id="name"
                               name="nome"
                               value="{{ usuario.nome or usuario.username or '' }}"
                               required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="nexus-label">
                        <i class="bi bi-envelope text-primary"></i> Endereço de E-mail <span class="text-danger">*</span>
                    </label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-envelope"></i>
                        <input type="email"
                               class="form-control nexus-input w-100"
                               id="email"
                               name="email"
                               value="{{ usuario.email or '' }}"
                               required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="telefone" class="nexus-label">
                        <i class="bi bi-telephone text-primary"></i> Telefone / Celular <span class="text-danger">*</span>
                    </label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-telephone"></i>
                        <input type="tel"
                               class="form-control nexus-input w-100"
                               id="telefone"
                               name="telefone"
                               value="{{ usuario.telefone or '' }}"
                               required>
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center pt-3 border-top">
                    <a href="{{ url_for('user.meus_dados') }}" class="btn btn-nexus-outline">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>

                    <button type="submit" class="btn btn-nexus-primary">
                        <i class="bi bi-check-lg"></i> Salvar Alterações
                    </button>
                </div>

            </form>

        </div>

    </div>
</div>
{% endblock %}
