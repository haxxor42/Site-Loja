{% extends "base.html" %}

{% block title %}Contatos{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-12 col-md-10 col-lg-8">

        <div class="nexus-card p-4 p-md-5">

            <!-- Cabeçalho -->
            <div class="text-center mb-4">
                <div class="brand-icon-box mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                    <i class="bi bi-chat-left-dots-fill"></i>
                </div>
                <h1 class="h3 fw-bold text-dark mb-1">Canais de Contato</h1>
                <p class="text-muted small mb-0">Entre em contato com nossa equipe de suporte e atendimento técnico.</p>
            </div>

            <!-- Informações de Contato -->
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="p-3 rounded-3 bg-light d-flex align-items-center gap-3">
                        <i class="bi bi-envelope-at text-primary fs-3"></i>
                        <div>
                            <div class="text-muted small">E-mail de Suporte</div>
                            <div class="fw-bold text-dark">suporte@nexuscore.com</div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="p-3 rounded-3 bg-light d-flex align-items-center gap-3">
                        <i class="bi bi-telephone text-primary fs-3"></i>
                        <div>
                            <div class="text-muted small">Central Telefônica</div>
                            <div class="fw-bold text-dark">(11) 4002-8922</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Formulário de Mensagem -->
            <form onsubmit="event.preventDefault(); alert('Mensagem enviada com sucesso! Responderemos em breve.'); this.reset();">
                <div class="mb-3">
                    <label class="nexus-label" for="contato-nome">Seu Nome</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-person"></i>
                        <input type="text" class="form-control nexus-input w-100" id="contato-nome" placeholder="Digite seu nome completo" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="nexus-label" for="contato-email">Seu E-mail</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-envelope"></i>
                        <input type="email" class="form-control nexus-input w-100" id="contato-email" placeholder="seuemail@exemplo.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="nexus-label" for="contato-msg">Mensagem / Dúvida</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-chat-text" style="top: 24px;"></i>
                        <textarea class="form-control nexus-input w-100" id="contato-msg" rows="4" placeholder="Como podemos ajudar você hoje?" required></textarea>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-nexus-primary py-2 justify-content-center">
                        <i class="bi bi-send-fill"></i> Enviar Mensagem
                    </button>
                </div>
            </form>

        </div>

    </div>
</div>
{% endblock %}
