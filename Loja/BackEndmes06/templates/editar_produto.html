{% extends "base.html" %}

{% block title %}Editar Produto{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
    <div class="col-12 col-lg-9 col-xl-8">

        <!-- Topo da Página -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1 small text-muted">
                        <li class="breadcrumb-item"><a href="{{ url_for('main.home') }}" class="text-decoration-none">Início</a></li>
                        <li class="breadcrumb-item"><a href="{{ url_for('loja.index') }}" class="text-decoration-none">Estoque</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Editar Produto</li>
                    </ol>
                </nav>
                <h1 class="h3 fw-bold text-dark mb-0 d-flex align-items-center gap-2">
                    <i class="bi bi-pencil-square text-primary"></i> Editar Produto #{{ produto.id_p }}
                </h1>
            </div>

            <div>
                <a href="{{ url_for('loja.index') }}" class="btn-nexus-outline">
                    <i class="bi bi-arrow-left"></i> Voltar ao Estoque
                </a>
            </div>
        </div>

        <div class="nexus-card p-4 p-md-5">

            <form action="{{ url_for('loja.editar_produto', id_p=produto.id_p) }}" method="POST">

                <!-- Nome do Produto -->
                <div class="mb-4">
                    <label for="nome_produto" class="nexus-label">
                        <i class="bi bi-box-seam text-primary"></i> Nome do Produto <span class="text-danger">*</span>
                    </label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-box-seam"></i>
                        <input type="text"
                               class="form-control nexus-input w-100"
                               id="nome_produto"
                               name="nome_produto"
                               value="{{ produto.nome_produto }}"
                               placeholder="Ex: Teclado Mecânico Wireless"
                               required>
                    </div>
                </div>

                <!-- Preço e Quantidade (Lado a Lado) -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="valor" class="nexus-label">
                            <i class="bi bi-currency-dollar text-primary"></i> Preço Unitário (R$) <span class="text-danger">*</span>
                        </label>
                        <div class="input-icon-wrap">
                            <i class="bi bi-currency-dollar"></i>
                            <input type="number"
                                   step="0.01"
                                   min="0"
                                   class="form-control nexus-input w-100"
                                   id="valor"
                                   name="valor"
                                   value="{{ '%.2f'|format(produto.valor) }}"
                                   placeholder="Ex: 199.90"
                                   required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="qtd_produto" class="nexus-label">
                            <i class="bi bi-stack text-primary"></i> Quantidade em Estoque <span class="text-danger">*</span>
                        </label>
                        <div class="input-icon-wrap">
                            <i class="bi bi-layers"></i>
                            <input type="number"
                                   min="0"
                                   class="form-control nexus-input w-100"
                                   id="qtd_produto"
                                   name="qtd_produto"
                                   value="{{ produto.qtd_produto }}"
                                   placeholder="Ex: 25"
                                   required>
                        </div>
                    </div>
                </div>

                <!-- Descrição do Produto -->
                <div class="mb-4">
                    <label for="descricao_produto" class="nexus-label">
                        <i class="bi bi-card-text text-primary"></i> Descrição / Observações
                    </label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-card-text" style="top: 24px;"></i>
                        <textarea class="form-control nexus-input w-100"
                                  id="descricao_produto"
                                  name="descricao_produto"
                                  rows="4"
                                  placeholder="Descrição técnica, detalhes ou observações sobre o item...">{{ produto.descricao_produto or '' }}</textarea>
                    </div>
                </div>

                <!-- Ações -->
                <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center pt-3 border-top">
                    <a href="{{ url_for('loja.index') }}" class="btn btn-nexus-outline">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-nexus-primary px-4 py-2">
                        <i class="bi bi-check-lg fs-5"></i> Salvar Alterações
                    </button>
                </div>

            </form>

        </div>

    </div>
</div>
{% endblock %}
