{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4">
    <div class="col-12 col-md-9 col-lg-6 col-xl-5">

        <div class="nexus-card p-4 p-md-5">

            <!-- Cabeçalho -->
            <div class="text-center mb-4">
                <div class="brand-icon-box mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h1 class="h3 fw-bold text-dark mb-1">Acessar Plataforma</h1>
                <p class="text-muted small mb-0">Digite suas credenciais para gerenciar seus produtos e dados.</p>
            </div>

            <!-- Formulário de Login -->
            <form action="{{ url_for('user.acesso') }}" method="POST">

                <!-- Login / E-mail -->
                <div class="mb-3">
                    <label for="login" class="nexus-label">
                        <i class="bi bi-person-fill text-primary"></i> E-mail ou Nome de Usuário <span class="text-danger">*</span>
                    </label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-envelope"></i>
                        <input type="text"
                               class="form-control nexus-input w-100"
                               id="login"
                               name="login"
                               placeholder="Digite seu email ou usuário"
                               required
                               autocomplete="username">
                    </div>
                </div>

                <!-- Senha -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="senha" class="nexus-label mb-0">
                            <i class="bi bi-lock-fill text-primary"></i> Senha de Acesso <span class="text-danger">*</span>
                        </label>
                    </div>
                    <div class="input-icon-wrap position-relative mt-1">
                        <i class="bi bi-lock"></i>
                        <input type="password"
                               class="form-control nexus-input w-100 pe-5"
                               id="senha"
                               name="senha"
                               placeholder="Digite sua senha"
                               required
                               autocomplete="current-password">
                        <button type="button" 
                                class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-muted text-decoration-none pe-3 border-0 bg-transparent"
                                onclick="toggleSenha('senha', this)"
                                tabindex="-1">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Lembrar de mim -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="lembrar" name="lembrar" checked>
                        <label class="form-check-label text-muted small" for="lembrar">
                            Lembrar meu acesso
                        </label>
                    </div>
                </div>

                <!-- Botão de Envio -->
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-nexus-primary py-2 justify-content-center fs-6">
                        <i class="bi bi-box-arrow-in-right fs-5"></i> Entrar no Sistema
                    </button>
                </div>

                <!-- Link para Cadastro -->
                <div class="text-center pt-3 border-top">
                    <p class="text-muted small mb-0">
                        Ainda não possui uma conta? 
                        <a href="{{ url_for('user.cadastro_usuario') }}" class="text-decoration-none fw-semibold text-primary">
                            Cadastre-se agora
                        </a>
                    </p>
                </div>

            </form>

        </div>

    </div>
</div>

<script>
function toggleSenha(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}
</script>
{% endblock %}
